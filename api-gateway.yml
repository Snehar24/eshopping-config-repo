# ===================================================================
# EShoppingZone - API Gateway Centralized Configuration
# ===================================================================
server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authServiceBreaker
                fallbackUri: forward:/fallback/auth

        - id: profile-service
          uri: lb://profile-service
          predicates:
            - Path=/profiles/**
          filters:
            - name: CircuitBreaker
              args:
                name: profileServiceBreaker
                fallbackUri: forward:/fallback/profiles

        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/products/**
          filters:
            - name: CircuitBreaker
              args:
                name: productServiceBreaker
                fallbackUri: forward:/fallback/products

        - id: cart-service
          uri: lb://cart-service
          predicates:
            - Path=/cart/**
          filters:
            - name: CircuitBreaker
              args:
                name: cartServiceBreaker
                fallbackUri: forward:/fallback/cart

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/orders/**
          filters:
            - name: CircuitBreaker
              args:
                name: orderServiceBreaker
                fallbackUri: forward:/fallback/orders

        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/inventory/**
          filters:
            - name: CircuitBreaker
              args:
                name: inventoryServiceBreaker
                fallbackUri: forward:/fallback/inventory

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/payments/**
          filters:
            - name: CircuitBreaker
              args:
                name: paymentServiceBreaker
                fallbackUri: forward:/fallback/payments

        - id: wallet-service
          uri: lb://wallet-service
          predicates:
            - Path=/wallet/**
          filters:
            - name: CircuitBreaker
              args:
                name: walletServiceBreaker
                fallbackUri: forward:/fallback/wallet

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
              - "http://127.0.0.1:3000"
              - "http://127.0.0.1:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true

resilience4j:
  circuitbreaker:
    instances:
      authServiceBreaker:
        baseConfig: default
      profileServiceBreaker:
        baseConfig: default
      productServiceBreaker:
        baseConfig: default
      cartServiceBreaker:
        baseConfig: default
      orderServiceBreaker:
        baseConfig: default
      inventoryServiceBreaker:
        baseConfig: default
      paymentServiceBreaker:
        baseConfig: default
      walletServiceBreaker:
        baseConfig: default

info:
  app:
    name: "EShoppingZone API Gateway"
    description: "Centralized Spring Cloud Gateway Configuration"
    version: "1.0.0"
