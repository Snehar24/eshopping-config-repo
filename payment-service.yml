# ===================================================================
# EShoppingZone - Payment Service Centralized Configuration
# ===================================================================
server:
  port: 8087

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/payment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

eshoppingzone:
  rabbitmq:
    exchange: eshoppingzone.exchange
    queue:
      stock-reserved: stock.reserved.payment.queue
    routing-key:
      stock-reserved: stock.reserved
      payment-successful: payment.successful
      payment-failed: payment.failed

resilience4j:
  circuitbreaker:
    instances:
      walletService:
        baseConfig: default

info:
  app:
    name: "Payment Service"
    description: "EShoppingZone Payment Processing Microservice"
    version: "1.0.0"
