# ===================================================================
# EShoppingZone - API Gateway Centralized Configuration
# ===================================================================
server.port=8080

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Auth Route
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**
spring.cloud.gateway.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[0].filters[0].args.name=authServiceBreaker
spring.cloud.gateway.routes[0].filters[0].args.fallbackUri=forward:/fallback/auth

# Profile Route
spring.cloud.gateway.routes[1].id=profile-service
spring.cloud.gateway.routes[1].uri=lb://profile-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/profiles/**
spring.cloud.gateway.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[1].filters[0].args.name=profileServiceBreaker
spring.cloud.gateway.routes[1].filters[0].args.fallbackUri=forward:/fallback/profiles

# Product Route
spring.cloud.gateway.routes[2].id=product-service
spring.cloud.gateway.routes[2].uri=lb://product-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/products/**
spring.cloud.gateway.routes[2].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[2].filters[0].args.name=productServiceBreaker
spring.cloud.gateway.routes[2].filters[0].args.fallbackUri=forward:/fallback/products

# Cart Route
spring.cloud.gateway.routes[3].id=cart-service
spring.cloud.gateway.routes[3].uri=lb://cart-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/cart/**
spring.cloud.gateway.routes[3].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[3].filters[0].args.name=cartServiceBreaker
spring.cloud.gateway.routes[3].filters[0].args.fallbackUri=forward:/fallback/cart

# Order Route
spring.cloud.gateway.routes[4].id=order-service
spring.cloud.gateway.routes[4].uri=lb://order-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/orders/**
spring.cloud.gateway.routes[4].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[4].filters[0].args.name=orderServiceBreaker
spring.cloud.gateway.routes[4].filters[0].args.fallbackUri=forward:/fallback/orders

# Inventory Route
spring.cloud.gateway.routes[5].id=inventory-service
spring.cloud.gateway.routes[5].uri=lb://inventory-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/inventory/**
spring.cloud.gateway.routes[5].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[5].filters[0].args.name=inventoryServiceBreaker
spring.cloud.gateway.routes[5].filters[0].args.fallbackUri=forward:/fallback/inventory

# Payment Route
spring.cloud.gateway.routes[6].id=payment-service
spring.cloud.gateway.routes[6].uri=lb://payment-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/payments/**
spring.cloud.gateway.routes[6].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[6].filters[0].args.name=paymentServiceBreaker
spring.cloud.gateway.routes[6].filters[0].args.fallbackUri=forward:/fallback/payments

# Wallet Route
spring.cloud.gateway.routes[7].id=wallet-service
spring.cloud.gateway.routes[7].uri=lb://wallet-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/wallet/**
spring.cloud.gateway.routes[7].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[7].filters[0].args.name=walletServiceBreaker
spring.cloud.gateway.routes[7].filters[0].args.fallbackUri=forward:/fallback/wallet

# Global CORS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

# Circuit Breaker Instances
resilience4j.circuitbreaker.instances.authServiceBreaker.base-config=default
resilience4j.circuitbreaker.instances.profileServiceBreaker.base-config=default
resilience4j.circuitbreaker.instances.productServiceBreaker.base-config=default
resilience4j.circuitbreaker.instances.cartServiceBreaker.base-config=default
resilience4j.circuitbreaker.instances.orderServiceBreaker.base-config=default
resilience4j.circuitbreaker.instances.inventoryServiceBreaker.base-config=default
resilience4j.circuitbreaker.instances.paymentServiceBreaker.base-config=default
resilience4j.circuitbreaker.instances.walletServiceBreaker.base-config=default

info.app.name=EShoppingZone API Gateway
info.app.description=Centralized Spring Cloud Gateway Configuration
info.app.version=1.0.0
