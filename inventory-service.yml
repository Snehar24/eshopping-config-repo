# ===================================================================
# EShoppingZone - Inventory Service Centralized Configuration
# ===================================================================
server:
  port: 8086

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/inventory_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

eshoppingzone:
  rabbitmq:
    exchange: eshoppingzone.exchange
    queue:
      order-created: order.created.inventory.queue
      order-cancelled: order.cancelled.inventory.queue
    routing-key:
      order-created: order.created
      order-cancelled: order.cancelled
      stock-reserved: stock.reserved
      stock-unavailable: stock.unavailable
      stock-released: stock.released

info:
  app:
    name: "Inventory Service"
    description: "EShoppingZone Inventory & Stock Microservice"
    version: "1.0.0"
