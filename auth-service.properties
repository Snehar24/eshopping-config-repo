# ===================================================================
# EShoppingZone - Auth Service Centralized Configuration
# ===================================================================
server.port=8081

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

spring.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
spring.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

eshoppingzone.rabbitmq.exchange=eshoppingzone.exchange
eshoppingzone.rabbitmq.user-registered-routing-key=user.registered

info.app.name=Auth Service
info.app.description=EShoppingZone Authentication & Security Microservice
info.app.version=1.0.0
