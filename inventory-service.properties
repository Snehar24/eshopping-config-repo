# ===================================================================
# EShoppingZone - Inventory Service Centralized Configuration
# ===================================================================
server.port=8086

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/inventory_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

eshoppingzone.rabbitmq.exchange=eshoppingzone.exchange
eshoppingzone.rabbitmq.queue.order-created=order.created.inventory.queue
eshoppingzone.rabbitmq.queue.order-cancelled=order.cancelled.inventory.queue
eshoppingzone.rabbitmq.routing-key.order-created=order.created
eshoppingzone.rabbitmq.routing-key.order-cancelled=order.cancelled
eshoppingzone.rabbitmq.routing-key.stock-reserved=stock.reserved
eshoppingzone.rabbitmq.routing-key.stock-unavailable=stock.unavailable
eshoppingzone.rabbitmq.routing-key.stock-released=stock.released

info.app.name=Inventory Service
info.app.description=EShoppingZone Inventory & Stock Microservice
info.app.version=1.0.0
