# ===================================================================
# EShoppingZone - Cart Service Centralized Configuration
# ===================================================================
server.port=8084

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/cart_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Cart Service Circuit Breaker & Retry Configuration
resilience4j.circuitbreaker.instances.productService.base-config=default
resilience4j.retry.instances.productService.base-config=default

info.app.name=Cart Service
info.app.description=EShoppingZone Shopping Cart Microservice
info.app.version=1.0.0
