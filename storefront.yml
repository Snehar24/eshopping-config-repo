server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/eshoppingzone;MODE=MySQL;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  thymeleaf:
    cache: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        auto-startup: ${RABBITMQ_AUTO_STARTUP:false}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:sneharamesh201204@gmail.com}
    password: ${MAIL_PASSWORD:trld ujjf xmuq phyc}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

resilience4j:
  circuitbreaker:
    instances:
      notificationService:
        baseConfig: default
      openAiImageService:
        baseConfig: default

info:
  app:
    name: "EShoppingZone Storefront"
    description: "Storefront Web Application"
    version: "1.0.0"
