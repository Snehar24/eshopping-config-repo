# ===================================================================
# EShoppingZone - Payment Service Centralized Configuration
# ===================================================================
server.port=8087

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/payment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

eshoppingzone.rabbitmq.exchange=eshoppingzone.exchange
eshoppingzone.rabbitmq.queue.stock-reserved=stock.reserved.payment.queue
eshoppingzone.rabbitmq.routing-key.stock-reserved=stock.reserved
eshoppingzone.rabbitmq.routing-key.payment-successful=payment.successful
eshoppingzone.rabbitmq.routing-key.payment-failed=payment.failed

# Payment Service Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.walletService.base-config=default

info.app.name=Payment Service
info.app.description=EShoppingZone Payment Processing Microservice
info.app.version=1.0.0
