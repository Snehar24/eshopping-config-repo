# ===================================================================
# EShoppingZone - Cart Service Centralized Configuration
# ===================================================================
server:
  port: 8084

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/cart_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

resilience4j:
  circuitbreaker:
    instances:
      productService:
        baseConfig: default
  retry:
    instances:
      productService:
        baseConfig: default

info:
  app:
    name: "Cart Service"
    description: "EShoppingZone Shopping Cart Microservice"
    version: "1.0.0"
