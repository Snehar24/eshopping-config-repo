# ===================================================================
# EShoppingZone - Order Service Centralized Configuration
# ===================================================================
server.port=8085

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/order_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

eshoppingzone.rabbitmq.exchange=eshoppingzone.exchange
eshoppingzone.rabbitmq.queue.payment-successful=payment.successful.order.queue
eshoppingzone.rabbitmq.queue.payment-failed=payment.failed.order.queue
eshoppingzone.rabbitmq.queue.stock-unavailable=stock.unavailable.order.queue
eshoppingzone.rabbitmq.routing-key.order-created=order.created
eshoppingzone.rabbitmq.routing-key.order-confirmed=order.confirmed
eshoppingzone.rabbitmq.routing-key.order-cancelled=order.cancelled
eshoppingzone.rabbitmq.routing-key.order-shipped=order.shipped
eshoppingzone.rabbitmq.routing-key.order-delivered=order.delivered
eshoppingzone.rabbitmq.routing-key.payment-successful=payment.successful
eshoppingzone.rabbitmq.routing-key.payment-failed=payment.failed
eshoppingzone.rabbitmq.routing-key.stock-unavailable=stock.unavailable

info.app.name=Order Service
info.app.description=EShoppingZone Order Management Microservice
info.app.version=1.0.0
