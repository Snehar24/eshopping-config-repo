# ===================================================================
# EShoppingZone - Wallet Service Centralized Configuration
# ===================================================================
server:
  port: 8088

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/wallet_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

info:
  app:
    name: "Wallet Service"
    description: "EShoppingZone E-Wallet & Digital Balance Microservice"
    version: "1.0.0"
